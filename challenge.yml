name: "Italian Telegraph Intercept"
author: "AdwaCTF"
category: networking
description: |-
  February 29, 1896. As night fell across the mountains of Tigray, Italian Supreme
  Commander Oreste Baratieri sent classified operational orders to his brigade generals
  through the Sauria telegraph relay.
  
  Tigrayan scout wiremen loyal to Ras Alula Engida tapped the military copper telegraph
  line and captured all traffic for the night. The raw network capture contains hundreds
  of routine brigade dispatches, logistics reports, and heartbeat signals — but buried
  among the noise are three encrypted telegrams from Civil Commissioner Ferdinando
  Martini, intercepted in transit.
  
  The Cipher Bureau was using a layered encoding scheme. Identify the encrypted sessions,
  recover the cipher key, decode the fragments in order, and reassemble the flag.
  
  Flag format: `AdwaCTF{...}`
value: 500
type: dynamic
flags:
  - AdwaCTF{73l36r4ph_w1r35_t4pp3d_47_54ur14}
tags:
  - medium
  - networking
  - pcap
  - wire-analysis
  - xor
  - reassembly
  - dynamic-flag
files:
  - output/intercept.pcap
  - output/wiretap_log.txt
generator:
  enabled: true
  image: "ghcr.io/azariyasmekonen/italian-telegraph-intercept:latest"
  output_filename: "intercept.pcap"
  timeout: 30
  cache_ttl: 72
hints:
  - content: "Filter for IMTP/1.0 ENCRYPTED_TELEGRAM packets — there are real ones and decoys. The real ones share a common WIRE_ID prefix. Sort by WIRE_ID suffix (A → B → C)."
    cost: 50
  - content: "Each DATA field is base64-encoded ciphertext. The cipher key was broadcast in a SYSTEM_KEY_ROTATION packet somewhere in the capture. XOR-decrypt each fragment, then extract the BODY field."
    cost: 100
state: visible
version: "0.2"
