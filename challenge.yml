name: "Italian Telegraph Intercept"
author: "AdwaCTF"
category: networking
description: |-
  February 29, 1896. As night fell across the mountains of Tigray, Italian Supreme
  Commander Oreste Baratieri sent encrypted telegraph instructions to his four
  brigade generals.
  
  Tigrayan scouts tapped the military telegraph line running between Asmara,
  Sauria, and the advance columns. We have extracted a raw network capture file
  of the telegraph relay.
  
  Reassemble the intercepted telegraph sessions, decode the emergency communication,
  and recover the flag!
  
  Flag format: `AdwaCTF{...}`
value: 500
type: dynamic
flags:
  - AdwaCTF{73l36r4ph_w1r35_t4pp3d_47_54ur14}
tags:
  - medium
  - networking
  - pcap
  - wire-analysis
  - dynamic-flag
files:
  - output/intercept.pcap
  - output/wiretap_log.txt
generator:
  enabled: true
  image: "ghcr.io/azariyasmekonen/italian-telegraph-intercept:latest"
  output_filename: "intercept.pcap"
  timeout: 30
  cache_ttl: 72
hints:
  - content: "Open the capture in Wireshark or use a python script to inspect the TCP streams on port 1896. Look for encoded payloads labeled 'IMTP/1.0 ENCRYPTED_TELEGRAM'."
    cost: 50
state: visible
version: "0.1"
