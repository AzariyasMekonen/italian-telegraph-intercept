name: "Italian Telegraph Intercept"
author: "AdwaCTF"
category: networking
description: |-
  On the eve of battle, the copper wire between Sauria and the coast hummed
  with frantic Italian telegraphs. Tigrayan wiremen tapped the line and
  recorded the traffic alongside the relay switchboard log.
  
  Amidst the garrison chatter, General Baratieri's midnight orders slid
  across the wire in code. Piece together what was spoken in the dark.
  
  Flag format: `AdwaCTF{...}`
value: 500
type: dynamic
flags:
  - AdwaCTF{73l36r4ph_w1r35_t4pp3d_47_54ur14}
tags:
  - medium
  - networking
  - pcap
  - wire-analysis
  - xor
  - reassembly
  - dynamic-flag
files:
  - output/intercept.pcap
  - output/wiretap_log.txt
generator:
  enabled: true
  image: "ghcr.io/azariyasmekonen/italian-telegraph-intercept:latest"
  output_filename: "intercept.pcap"
  timeout: 30
  cache_ttl: 72
hints:
  - content: "Filter for IMTP/1.0 ENCRYPTED_TELEGRAM packets — there are real ones and decoys. The real ones share a common WIRE_ID prefix. Sort by WIRE_ID suffix (A → B → C)."
    cost: 50
  - content: "Each DATA field is base64-encoded ciphertext. Recover the broadcast NETWORK_KEY from the SYSTEM_KEY_ROTATION packet in the PCAP, combine it with the PHYSICAL_KEY from wiretap_log.txt, and XOR-decrypt each fragment."
    cost: 100
state: visible
version: "0.3"
